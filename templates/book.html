{% extends "base.html" %}
{% block content %}
<form action="/book" method="POST" id="bookingForm" class="space-y-6">
    
    <div class="bg-gray-800 p-5 rounded-2xl border border-gray-700 shadow-xl relative overflow-hidden animate__animated animate__fadeInUp">
        <div class="absolute -top-10 -right-10 w-32 h-32 bg-indigo-500/20 rounded-full blur-3xl"></div>
        <div class="flex justify-between items-start mb-4 relative z-10">
            <h3 class="font-bold text-indigo-300 uppercase tracking-widest text-sm flex items-center gap-2">
                <span class="bg-indigo-500/20 p-1 rounded text-xs">1</span> Horaire
            </h3>
            <div class="text-right">
                <p id="heureDisplay" class="text-3xl font-black text-white">--:--</p>
                <div id="loadingSpinner" class="hidden text-[10px] text-indigo-400 animate-pulse">Calcul...</div>
            </div>
        </div>
        <div class="space-y-4 relative z-10">
            <div class="relative">
                <select name="date_valeur" id="dateInput" class="w-full bg-gray-900 text-white p-3 rounded-xl border border-gray-700 font-bold appearance-none outline-none focus:border-indigo-500 transition">
                    {% for j in jours %}
                    <option value="{{ j.valeur }}">{{ j.affichage }}</option>
                    {% endfor %}
                </select>
                <div class="absolute right-4 top-3.5 pointer-events-none text-gray-500">▼</div>
            </div>
            <div class="grid grid-cols-2 gap-3">
                <label class="cursor-pointer group">
                    <input type="radio" name="sens" value="aller" class="peer hidden sensInput" required>
                    <div class="bg-gray-900 p-3 rounded-xl text-center border border-gray-700 peer-checked:bg-indigo-600 peer-checked:border-indigo-400 transition hover:bg-gray-700">
                        <span class="text-xl block mb-1">🌅</span>
                        <span class="font-bold text-xs uppercase">Matin</span>
                    </div>
                </label>
                <label class="cursor-pointer group">
                    <input type="radio" name="sens" value="retour" class="peer hidden sensInput">
                    <div class="bg-gray-900 p-3 rounded-xl text-center border border-gray-700 peer-checked:bg-indigo-600 peer-checked:border-indigo-400 transition hover:bg-gray-700">
                        <span class="text-xl block mb-1">🌇</span>
                        <span class="font-bold text-xs uppercase">Soir</span>
                    </div>
                </label>
            </div>
        </div>
    </div>

    <div class="text-center animate__animated animate__fadeInUp" style="animation-delay: 0.1s;">
        <h3 class="font-bold text-gray-500 text-xs uppercase tracking-widest mb-2">2. Choisis ta place</h3>
        
        <div class="relative w-full max-w-[20rem] mx-auto h-[25rem]">
            <svg viewBox="0 0 240 380" class="w-full h-full drop-shadow-2xl">
                <defs>
                    <linearGradient id="bodyTheme" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="#312e81"/> <stop offset="100%" stop-color="#0f172a"/> 
                    </linearGradient>
                    <filter id="glowSeat" x="-50%" y="-50%" width="200%" height="200%">
                        <feGaussianBlur stdDeviation="4" result="blur"/>
                        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
                    </filter>
                </defs>

                <style>
                    .seat { fill: #312e81; stroke: #4f46e5; stroke-width: 2px; transition: all 0.3s ease; cursor: pointer; }
                    .seat:hover:not(.occupied) { stroke: #818cf8; fill: #4338ca; filter: drop-shadow(0 0 6px rgba(129, 140, 248, 0.6)); }
                    .seat.selected { fill: #4f46e5; stroke: #a5b4fc; filter: url(#glowSeat); }
                    .seat.occupied { fill: #020617; stroke: #1e1b4b; opacity: 0.5; cursor: not-allowed; }
                    .seat-txt { fill: #a5b4fc; font-size: 11px; font-weight: 800; text-anchor: middle; pointer-events: none; }
                    .selected + .seat-txt { fill: white; }
                    .driver-seat { fill: #1e1b4b; stroke: #312e81; stroke-width: 2; pointer-events: none; }
                </style>

                <path d="M 45 125 L 15 130 L 15 150 L 45 145 Z" fill="#3730a3" stroke="#6366f1" stroke-width="2"/>
                <path d="M 195 125 L 225 130 L 225 150 L 195 145 Z" fill="#3730a3" stroke="#6366f1" stroke-width="2"/>

                <path d="M 40 120 L 45 80 Q 45 60, 75 60 L 165 60 Q 195 60, 195 80 L 200 120 L 200 280 Q 200 320, 170 320 L 70 320 Q 40 320, 40 280 Z" 
                      fill="url(#bodyTheme)" stroke="#818cf8" stroke-width="3"/>
                
                <path d="M 55 100 Q 120 90, 185 100 L 190 135 Q 120 130, 50 135 Z" fill="#0f0a2e" stroke="#3730a3"/>
                
                <path d="M 50 280 Q 120 285, 190 280 L 185 300 Q 120 305, 55 300 Z" fill="#0f0a2e" stroke="#3730a3"/>
                
                <rect x="50" y="140" width="140" height="135" rx="10" fill="#2e2a5b" opacity="0.4" stroke="none"/>

                <rect x="60" y="155" width="45" height="45" rx="14" class="driver-seat"/>
                <text x="82.5" y="182" class="seat-txt" fill="#ef4444" style="font-size:9px; opacity:0.7">COND</text>

                <g onclick="selectSeat('RF')"><rect id="seat-RF" x="135" y="155" width="45" height="45" rx="14" class="seat"/><text x="157.5" y="182" class="seat-txt">RF</text></g>
                <g onclick="selectSeat('LB')"><rect id="seat-LB" x="50" y="225" width="40" height="40" rx="14" class="seat"/><text x="70" y="250" class="seat-txt">LB</text></g>
                <g onclick="selectSeat('MB')"><rect id="seat-MB" x="100" y="225" width="40" height="40" rx="14" class="seat"/><text x="120" y="250" class="seat-txt">MB</text></g>
                <g onclick="selectSeat('RB')"><rect id="seat-RB" x="150" y="225" width="40" height="40" rx="14" class="seat"/><text x="170" y="250" class="seat-txt">RB</text></g>
            </svg>
        </div>
        <input type="hidden" name="seat" id="selected_seat_input" required>
    </div>

    <div class="bg-gray-800 p-4 rounded-2xl border border-gray-700 animate__animated animate__fadeInUp" style="animation-delay: 0.2s;">
        <h3 class="font-bold text-indigo-300 uppercase tracking-widest text-sm mb-3 flex items-center gap-2">
            <span class="bg-indigo-500/20 p-1 rounded text-xs">3</span> Détails
        </h3>
        <div class="space-y-3">
            <select name="arret" class="w-full bg-gray-900 text-white p-3 rounded-xl border border-gray-700 outline-none text-sm">
                {% for arret in arrets %}
                <option value="{{ arret }}">{{ arret }}</option>
                {% endfor %}
            </select>
            <label class="flex items-center justify-between p-3 bg-gray-900 rounded-xl cursor-pointer border border-gray-700 hover:border-indigo-500 transition group">
                <div class="flex items-center gap-2">
                    <span class="text-lg group-hover:scale-110 transition">🎧</span>
                    <span class="font-bold text-sm text-gray-300 group-hover:text-white">Option DJ</span>
                </div>
                <div class="flex items-center gap-2">
                    <span class="text-yellow-500 text-xs font-bold">+5 🪙</span>
                    <input type="checkbox" name="dj" id="djCheckbox" onchange="calculerTotal()" class="w-5 h-5 accent-indigo-500 rounded">
                </div>
            </label>
        </div>
    </div>

    <button type="submit" class="w-full bg-gradient-to-r from-indigo-600 to-blue-600 hover:from-indigo-500 hover:to-blue-500 text-white py-5 rounded-2xl font-bold text-xl shadow-lg border border-indigo-500/30 transform hover:-translate-y-1 active:scale-95 transition-all duration-300 animate__animated animate__fadeInUp" style="animation-delay: 0.3s;">
        PAYER <span id="totalPriceDisplay">10</span> 🪙
    </button>
</form>

<script>
    // Calcul du prix total corrigé
    function calculerTotal() {
        let total = 10; // Prix de base
        const dateInput = document.getElementById('dateInput').value;
        
        // Majoration jour (+2 par jour d'écart)
        if(dateInput) {
            const dateSelect = new Date(dateInput);
            const now = new Date();
            // On remet les heures à 0 pour comparer uniquement les jours
            dateSelect.setHours(0,0,0,0);
            now.setHours(0,0,0,0);
            
            const diffTime = dateSelect - now;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)); 
            
            if(diffDays > 0) total += (diffDays * 2);
        }

        const seat = document.getElementById('selected_seat_input').value;
        if(!seat) {
            document.getElementById('totalPriceDisplay').innerText = "--";
            return;
        }

        // Siège Passager (RF) : +10 (pour faire 20 au total avec la base de 10)
        if(seat === 'RF') total += 10; 

        // Option DJ : +5
        if(document.getElementById('djCheckbox').checked) total += 5;
        
        document.getElementById('totalPriceDisplay').innerText = total;
    }

    // Sélection du siège
    function selectSeat(id) {
        const el = document.getElementById('seat-' + id);
        if (el.classList.contains('occupied')) return;
        
        document.querySelectorAll('.seat').forEach(s => s.classList.remove('selected'));
        el.classList.add('selected');
        document.getElementById('selected_seat_input').value = id;
        
        if (navigator.vibrate) navigator.vibrate(50);
        calculerTotal();
    }

    // Vérification des horaires
    const dInput = document.getElementById('dateInput');
    const sInputs = document.querySelectorAll('.sensInput');
    const hDisplay = document.getElementById('heureDisplay');

    function updateHoraire() {
        let sVal = null;
        sInputs.forEach(i => { if(i.checked) sVal = i.value; });
        
        if(!dInput.value || !sVal) return;
        
        hDisplay.classList.add('opacity-50');
        document.getElementById('loadingSpinner').classList.remove('hidden');
        
        document.querySelectorAll('.seat').forEach(s => {
            s.classList.remove('occupied', 'selected');
        });
        document.getElementById('selected_seat_input').value = "";
        calculerTotal();
        
        fetch('/api/check_horaire', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({date: dInput.value, sens: sVal})
        })
        .then(r => r.json())
        .then(d => {
            hDisplay.innerText = d.heure;
            hDisplay.className = (d.heure.includes("Pas") || d.heure.includes("Erreur")) 
                ? "text-3xl font-black text-red-400" 
                : "text-3xl font-black text-white";
            
            if(d.occupied) {
                d.occupied.forEach(id => {
                    const seatEl = document.getElementById('seat-' + id);
                    if(seatEl) seatEl.classList.add('occupied');
                });
            }
        })
        .finally(() => {
            document.getElementById('loadingSpinner').classList.add('hidden');
            hDisplay.classList.remove('opacity-50');
        });
    }

    dInput.addEventListener('change', updateHoraire);
    sInputs.forEach(i => i.addEventListener('change', updateHoraire));
    updateHoraire();
</script>
{% endblock %}
