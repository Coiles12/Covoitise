<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Navette Potes</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Outfit', 'sans-serif'] },
                    colors: {
                        arcade: {
                            dark: '#0f172a',
                            panel: '#1e293b',
                            accent: '#6366f1',
                            glow: '#818cf8'
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        /* Mise à jour du style global pour correspondre à la nouvelle ambiance du logo */
        body { 
            background-color: #0f172a; 
            background-image: radial-gradient(circle at 50% 0%, #312e81 0%, #0f172a 70%); 
            background-attachment: fixed; 
        }
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-6px); } 100% { transform: translateY(0px); } }
        .floating { animation: float 5s ease-in-out infinite; }
        .custom-scrollbar::-webkit-scrollbar { height: 4px; width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #6366f1; border-radius: 4px; }
        
        /* Classe glass ajoutée pour cohérence */
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="text-white font-sans antialiased min-h-screen selection:bg-indigo-500 selection:text-white">
    
    <div class="w-full max-w-md mx-auto min-h-screen relative shadow-2xl border-x border-gray-800 bg-gray-900/50">
        
        <div class="glass p-4 flex justify-between items-center sticky top-0 z-50 border-b border-gray-800 animate__animated animate__slideInDown">
            
            <a href="{{ url_for('dashboard') if current_user else '/' }}" class="group relative flex items-center gap-3 px-3 py-2 rounded-2xl border border-indigo-500/30 bg-gray-900/50 hover:border-indigo-400 hover:bg-gray-800 transition-all duration-300 shadow-[0_0_15px_rgba(79,70,229,0.15)] hover:shadow-[0_0_20px_rgba(79,70,229,0.3)]">
                <span class="text-2xl bg-clip-text text-transparent bg-gradient-to-tr from-indigo-400 to-purple-400 drop-shadow-md pb-1">
                    🚕
                </span>
                <h1 class="font-black text-xl tracking-wide leading-none text-white">
                    COVOIT<span class="text-indigo-400">ISE</span>
                </h1>
            </a>
            {% if current_user %}
            <div class="flex items-center gap-3">
                <div class="bg-gray-800/80 px-3 py-1.5 rounded-full border border-gray-700 flex items-center gap-2 shadow-inner">
                    <span class="text-yellow-400 font-bold text-sm">{{ current_user.credits }}</span><span class="text-xs">🪙</span>
                </div>
                <a href="/logout" class="bg-red-500/10 hover:bg-red-500 text-red-400 hover:text-white p-2 rounded-xl transition-all border border-red-500/20">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                    </svg>
                </a>
            </div>
            {% endif %}
        </div>
        
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div id="flashMessage" class="fixed top-24 left-4 right-4 z-[60] mx-auto bg-gray-800 text-white p-4 rounded-xl border-l-4 border-indigo-500 shadow-2xl flex items-center justify-between gap-3 animate__animated animate__fadeInDown">
                    <span class="font-bold text-sm flex-1">{{ messages[0] }}</span><button onclick="this.parentElement.remove()" class="text-gray-400 hover:text-white">✕</button>
                </div>
            {% endif %}
        {% endwith %}
        
        <div class="p-5 pb-24">
            {% block content %}{% endblock %}
        </div>
    </div>
    
    <script>
        const flashMsg=document.getElementById('flashMessage');
        if(flashMsg) setTimeout(()=>{
            flashMsg.classList.add('animate__fadeOutUp');
            setTimeout(()=>flashMsg.remove(),500);
        },3500);
    </script>
</body>
</html>
